[project]
name = "sizeify-api"
version = "0.1.0"
description = "Sizeify backend API"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the ADR 0001 Phase 0 baseline. Bumping any of these is a
    # deliberate change (see docs/adr/0001-phase-0-foundation.md).
    "fastapi[standard]==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "arq==0.28.0",
    "anthropic==0.102.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the src/ layout on sys.path directly. We do not rely on the editable
# install's .pth for module resolution because uv's editable .pth is not
# reliably honored in this venv; this makes `uv run pytest` deterministic.
pythonpath = ["src"]
markers = [
    "slow: benchmark / wall-clock-sensitive tests. Skipped by default in CI's fast lane; run with `pytest -m slow` (or `-m 'not slow'` to exclude).",
]
