# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Allow Gradle to provision a compatible JDK if the system one is too new/old.
org.gradle.java.installations.auto-download=true

# Help Gradle discover brew-installed JDKs as candidates for the daemon
# toolchain (declared in gradle/gradle-daemon-jvm.properties = JDK 17). The
# JDK 21 path is kept as a fallback. Non-existent paths (e.g. on CI/Linux) are
# ignored; there JAVA_HOME from setup-java supplies JDK 17.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
