# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Allow Gradle to provision a compatible JDK if the system one is too new/old.
org.gradle.java.installations.auto-download=true

# Discover the brew-installed openjdk@21 as a candidate JDK for the daemon
# toolchain (declared in gradle/gradle-daemon-jvm.properties).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
