# Local-dev infrastructure for the Sizeify backend.
#
# Credentials are env-driven with sensible local-only defaults. Override by
# exporting variables or creating an `infra/.env` file (gitignored). The same
# values appear in apps/api/.env.example so the backend can connect.
#
# Bring up:   docker compose -f infra/docker-compose.yml up -d
# Tear down:  docker compose -f infra/docker-compose.yml down
# Wipe data:  docker compose -f infra/docker-compose.yml down -v

name: sizeify-infra

services:
  postgres:
    image: postgres:16
    container_name: sizeify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sizeify}
      POSTGRES_USER: ${POSTGRES_USER:-sizeify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sizeify}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-sizeify}" -d "${POSTGRES_DB:-sizeify}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: sizeify-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
