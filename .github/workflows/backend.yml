name: backend

# Runs on every push to main and every PR. Path filtering is done per-job (see
# the `changes` job) rather than on the trigger, so the always-running `gate`
# job can serve as a stable required status check even on PRs that don't touch
# the backend.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes (backend)
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/backend.yml'

  test:
    name: lint + type + test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sizeify
          POSTGRES_USER: sizeify
          POSTGRES_PASSWORD: sizeify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sizeify -d sizeify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://sizeify:sizeify@localhost:5432/sizeify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  # Always-running aggregate. This is the required status check on main: it
  # passes when the backend is unchanged (test skipped) and fails if the test
  # job failed or was cancelled.
  gate:
    name: backend gate
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream results
        run: |
          changes_result="${{ needs.changes.result }}"
          test_result="${{ needs.test.result }}"
          echo "changes: $changes_result | test: $test_result"
          if [ "$changes_result" != "success" ]; then
            echo "::error::path-detection job did not succeed"
            exit 1
          fi
          if [ "$test_result" = "failure" ] || [ "$test_result" = "cancelled" ]; then
            echo "::error::backend test job failed"
            exit 1
          fi
          echo "backend gate passed"
