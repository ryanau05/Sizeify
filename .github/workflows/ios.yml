name: ios

# Runs on every push to main and every PR. Path filtering is per-job so the
# always-running `gate` job can serve as a stable required status check even on
# PRs that don't touch the iOS app.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes (ios)
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ios.yml'

  build:
    name: build (iPhone 15 sim)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-14

    defaults:
      run:
        working-directory: apps/ios

    env:
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 15.x ships the iPhone 15 simulator in its default device set.
          # iPhone 15 here is intentional — local dev uses iPhone 16 because
          # the local Xcode 26.2 install doesn't ship iPhone 15. See
          # docs/adr/0001-phase-0-foundation.md §6 ("Notable decisions").
          xcode-version: "15.4"

      - name: Show toolchain + destinations
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 15" || true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/ios/DerivedData
          key: ios-deriveddata-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/**/*.pbxproj') }}
          restore-keys: |
            ios-deriveddata-

      - name: Build
        run: |
          xcodebuild build \
            -workspace Sizeify.xcworkspace \
            -scheme Sizeify \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

  # Always-running aggregate. This is the required status check on main: it
  # passes when the iOS app is unchanged (build skipped) and fails if the build
  # job failed or was cancelled.
  gate:
    name: ios gate
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream results
        run: |
          changes_result="${{ needs.changes.result }}"
          build_result="${{ needs.build.result }}"
          echo "changes: $changes_result | build: $build_result"
          if [ "$changes_result" != "success" ]; then
            echo "::error::path-detection job did not succeed"
            exit 1
          fi
          if [ "$build_result" = "failure" ] || [ "$build_result" = "cancelled" ]; then
            echo "::error::iOS build job failed"
            exit 1
          fi
          echo "ios gate passed"
