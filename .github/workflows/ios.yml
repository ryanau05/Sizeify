name: ios

# Trigger on changes to the iOS app or to this workflow file.
on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios.yml

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (iPhone 15 sim)
    runs-on: macos-14

    defaults:
      run:
        working-directory: apps/ios

    env:
      DERIVED_DATA: DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Xcode 15.x ships the iPhone 15 simulator in its default device set.
          xcode-version: "15.4"

      - name: Show toolchain + destinations
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 15" || true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/ios/DerivedData
          key: ios-deriveddata-${{ hashFiles('apps/ios/**/*.swift', 'apps/ios/**/*.pbxproj') }}
          restore-keys: |
            ios-deriveddata-

      - name: Build
        run: |
          xcodebuild build \
            -workspace Sizeify.xcworkspace \
            -scheme Sizeify \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
